<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Ujjval Dubey — Product Builder</title>
  <desc id="desc">Animated dark interface connecting artificial intelligence, full-stack software, and embedded systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="230" rx="18" fill="url(#background)"/>
  <rect width="900" height="230" rx="18" fill="url(#grid)"/>
  <ellipse cx="742" cy="114" rx="210" ry="175" fill="url(#halo)"/>
  <rect x="1" y="1" width="898" height="228" rx="17" fill="none" stroke="#334155" stroke-opacity="0.65"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="54" y="46" font-size="11" fill="#64748b" letter-spacing="2.5">PRODUCT SYSTEMS / ONLINE</text>
    <circle cx="32" cy="42" r="4" fill="#2dd4bf" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <text x="50" y="114" font-size="48" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">UJJVAL DUBEY</text>
    <rect x="50" y="129" width="418" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="70;418;418" keyTimes="0;0.65;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="51" y="161" font-size="14" fill="#94a3b8">AI + FULL-STACK + IoT + PRODUCT</text>
    <text x="51" y="188" font-size="12" fill="#64748b">building useful systems across software and hardware</text>
  </g>

  <g transform="translate(650 39)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 39L101 12l69 46-18 84-78 22-62-55z" stroke="#38bdf8" stroke-opacity="0.32"/>
    <path d="M35 39l39 125m27-152l51 130M12 109l158-51M35 39l117 103" stroke="#64748b" stroke-opacity="0.18"/>
    <g filter="url(#glow)">
      <circle cx="35" cy="39" r="5" fill="#38bdf8" stroke="none">
        <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="101" cy="12" r="4" fill="#818cf8" stroke="none">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="58" r="5" fill="#2dd4bf" stroke="none">
        <animate attributeName="r" values="5;3;5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="152" cy="142" r="4" fill="#38bdf8" stroke="none">
        <animate attributeName="opacity" values="1;.3;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="74" cy="164" r="5" fill="#2dd4bf" stroke="none">
        <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="109" r="4" fill="#818cf8" stroke="none"/>
    </g>
    <text x="75" y="93" fill="#cbd5e1" stroke="none" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">BUILD</text>
    <text x="75" y="109" fill="#64748b" stroke="none" font-family="'JetBrains Mono',monospace" font-size="8" text-anchor="middle">SHIP / LEARN</text>
  </g>
</svg>
