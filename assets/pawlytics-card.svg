<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Pawlytics flagship project</title>
  <desc id="desc">An animated interface card showing live risk mapping, citizen reports, and municipal intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/><stop offset="1" stop-color="#071b1c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="mapGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity=".06"/></pattern>
  </defs>
  <rect x="1" y="1" width="898" height="308" rx="18" fill="url(#bg)" stroke="#1e3a47"/>
  <rect x="22" y="22" width="856" height="266" rx="13" fill="#080f1a" stroke="#1e293b"/>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <text x="50" y="61" fill="#64748b" font-size="10" letter-spacing="2">FLAGSHIP / ACTIVE BUILD</text>
    <circle cx="831" cy="54" r="4" fill="#2dd4bf" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="817" y="58" text-anchor="end" fill="#2dd4bf" font-size="10">LIVE</text>
    <text x="49" y="108" fill="#f8fafc" font-size="36" font-weight="700">PAWLYTICS</text>
    <text x="50" y="137" fill="#94a3b8" font-size="13">STRAY-ANIMAL ANALYTICS + CONFLICT INTELLIGENCE</text>
    <text x="50" y="181" fill="#cbd5e1" font-size="13">citizen reports  →  AI validation  →  risk map  →  action</text>

    <g transform="translate(50 211)">
      <rect width="145" height="40" rx="8" fill="#0f1c29" stroke="#1e3a47"/><text x="72.5" y="17" text-anchor="middle" fill="#64748b" font-size="8">SIGNAL</text><text x="72.5" y="31" text-anchor="middle" fill="#38bdf8" font-size="11">LIVE REPORTS</text>
      <rect x="157" width="145" height="40" rx="8" fill="#0f1c29" stroke="#1e3a47"/><text x="229.5" y="17" text-anchor="middle" fill="#64748b" font-size="8">INTELLIGENCE</text><text x="229.5" y="31" text-anchor="middle" fill="#2dd4bf" font-size="11">RISK + ROUTES</text>
      <rect x="314" width="145" height="40" rx="8" fill="#0f1c29" stroke="#1e3a47"/><text x="386.5" y="17" text-anchor="middle" fill="#64748b" font-size="8">RESPONSE</text><text x="386.5" y="31" text-anchor="middle" fill="#818cf8" font-size="11">CONTROL ROOM</text>
    </g>
  </g>

  <g transform="translate(585 76)">
    <rect width="245" height="175" rx="12" fill="#0a1520" stroke="#1e3a47"/>
    <rect width="245" height="175" rx="12" fill="url(#mapGrid)"/>
    <path d="M18 144C51 117 71 132 95 102S142 88 157 56s39-32 70-40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8">
      <animate attributeName="stroke-dashoffset" values="30;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M22 36L70 73l42-38 56 86 56-48" fill="none" stroke="#64748b" stroke-opacity=".28"/>
    <g filter="url(#glow)">
      <circle cx="62" cy="121" r="19" fill="#f97316" fill-opacity=".08" stroke="#f97316" stroke-opacity=".8"><animate attributeName="r" values="9;22;9" dur="3.1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1;.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="154" cy="76" r="14" fill="#fb7185" fill-opacity=".08" stroke="#fb7185"><animate attributeName="r" values="7;17;7" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="205" cy="41" r="5" fill="#2dd4bf"/>
    </g>
    <rect x="15" y="14" width="80" height="21" rx="10" fill="#0f2530"/><circle cx="28" cy="24.5" r="3" fill="#2dd4bf"/><text x="38" y="28" fill="#cbd5e1" font-family="'JetBrains Mono',monospace" font-size="8">RISK MAP</text>
  </g>
</svg>
